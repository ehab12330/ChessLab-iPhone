name: Build ChessLab IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ChessLabIOS/**"
      - "project.yml"
      - "ChessLab-iOS-Fixed-Playable.zip"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract fixed ChessLab
        run: unzip -oq ChessLab-iOS-Fixed-Playable.zip -d .

      - name: Remove duplicate piece images
        run: |
          find ChessLabIOS/Assets.xcassets -name '*.png' ! -name 'piece.png' -delete

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project ChessLabIOS.xcodeproj -scheme ChessLabIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ChessLabIOS.app Payload/
          zip -qry ChessLab-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChessLab-unsigned-IPA
          path: ChessLab-unsigned.ipa
          if-no-files-found: error
