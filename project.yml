name: ChessLabIOS
options:
  bundleIdPrefix: com.chesslab
targets:
  ChessLabIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [ChessLabIOS]
    settings:
      base:
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chesslab.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
